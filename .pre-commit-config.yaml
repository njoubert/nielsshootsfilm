# Pre-commit hooks configuration
# See https://pre-commit.com for more information

default_language_version:
  node: system

# Vendored third-party code is committed for hermetic builds but should never be
# reformatted or linted by our hooks.
exclude: '^(backend/vendor/|frontend/\.pnpm-store/)'

repos:
  # ====================
  # General / Multi-language
  # ====================
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Prevent committing large files
      - id: check-added-large-files
        args: ['--maxkb=1000']
      # Check for files that would conflict on case-insensitive filesystems
      - id: check-case-conflict
      # Check for merge conflicts
      - id: check-merge-conflict
      # Check JSON files
      - id: check-json
        exclude: ^\.vscode/
      # Check YAML files
      - id: check-yaml
        args: ['--unsafe'] # Allow custom YAML tags
      # Detect private keys
      - id: detect-private-key
      # Fix end of files (exclude JSON files - Go backend manages their formatting)
      - id: end-of-file-fixer
        exclude: \.json$
      # Fix trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # ====================
  # Secrets Detection
  # ====================
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        # Lockfiles contain high-entropy integrity hashes, not secrets.
        exclude: '(package-lock\.json|pnpm-lock\.yaml)'

  # ====================
  # TypeScript / JavaScript
  # ====================
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        files: \.(js|ts|json|yaml|yml|md|html|css)$
        args:
          - --write
          - --ignore-unknown

  # ====================
  # Go
  # ====================
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # Format Go code
      - id: go-fmt
        args: [-w]
      # Organize imports
      - id: go-imports
      # Check go.mod is tidy
      - id: go-mod-tidy
      # Note: go-vet from this repo doesn't work (runs from wrong directory)
      # We use a custom local hook for go-vet instead (see below)

  # ====================
  # Bazel
  # ====================
  - repo: https://github.com/keith/pre-commit-buildifier
    rev: 6.4.0
    hooks:
      - id: buildifier
        args: [--lint=fix]
      - id: buildifier-lint

  # ====================
  # Markdown / Documentation
  # ====================
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        exclude: 'CHANGELOG.md'

  # Local hooks for custom checks
  - repo: local
    hooks:
      # ====================
      # Shell scripts
      # ====================
      # Use system shellcheck (installed via Homebrew) to avoid architecture issues
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        types: [shell]
        args: ['-x']
      # Check for JavaScript files in frontend/src (should only have TypeScript)
      - id: check-no-js-files
        name: Check No JavaScript Files in Frontend
        entry: scripts/check-no-js-files.sh
        language: system
        pass_filenames: false
        always_run: true

      # Check that shell scripts are only in designated scripts directories
      - id: check-script-locations
        name: Check Script Locations
        entry: scripts/check-script-locations.sh
        language: system
        files: \.sh$
        pass_filenames: true

      # Run TypeScript type checking
      - id: typescript-typecheck
        name: TypeScript Type Check
        entry: bash -c 'cd frontend && npm run typecheck'
        language: system
        files: \.ts$
        pass_filenames: false

      # Run ESLint on TypeScript files
      - id: eslint
        name: ESLint
        entry: bash -c 'cd frontend && npm run lint'
        language: system
        files: \.(ts|js)$
        pass_filenames: false

      # Run frontend unit tests (on push only)
      - id: frontend-unit-tests
        name: Frontend Unit Tests
        entry: bash -c 'cd frontend && npm run test:ci'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Run go vet on Go files
      - id: go-vet-local
        name: Go Vet
        entry: bash -c 'cd backend && go vet ./...'
        language: system
        files: \.go$
        pass_filenames: false

      # Run Go unit tests (on push only)
      - id: go-unit-tests
        name: Go Unit Tests
        entry: bash -c 'cd backend && go test -short ./...'
        language: system
        pass_filenames: false
        stages: [pre-push]

      # Run golangci-lint
      - id: golangci-lint
        name: golangci-lint
        entry: bash -c 'cd backend && golangci-lint run --fix'
        language: system
        files: \.go$
        pass_filenames: false
